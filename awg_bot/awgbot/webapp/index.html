<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWG Toolza</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Свои цвета, светлые и тёмные; тема — по Telegram или из «Вид панели» */
  :root, [data-theme="light"] {
    --bg: #eef2f7;
    --card: #ffffff;
    --soft: #e6edf6;
    --border: #d4dde9;
    --sep: #e3e9f1;
    --text: #0f172a;
    --hint: #64748b;
    --accent: #0a8fd6;
    --accent-soft: #dcefff;
    --accent-text: #ffffff;
    --ok: #0f9e8e;
    --ok-soft: #d6f3ef;
    --danger: #e0443e;
    --danger-soft: #fde4e2;
    --warn: #c2700a;
    --warn-soft: #fdf0dc;
    --link: #0a8fd6;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }
  [data-theme="dark"] {
    --bg: #0d141e;
    --card: #151f2c;
    --soft: #1b2838;
    --border: #2a3a4f;
    --sep: #223044;
    --text: #e7eef7;
    --hint: #8a9bb2;
    --accent: #36a9ef;
    --accent-soft: #14324a;
    --accent-text: #ffffff;
    --ok: #2cc3ae;
    --ok-soft: #10352f;
    --danger: #f2615b;
    --danger-soft: #3c1c1d;
    --warn: #f0a63c;
    --warn-soft: #3a2a12;
    --link: #4db4f2;
    --shadow: none;
  }
  /* Жирность шрифта — «Вид панели»: тоньше / обычная / жирнее */
  :root { --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
          --w-text: 400; --w-mid: 500; --w-semi: 600; --w-bold: 700; --w-heavy: 800; }
  [data-weight="light"] { --w-text: 400; --w-mid: 400; --w-semi: 500; --w-bold: 600; --w-heavy: 700; }
  [data-weight="bold"] { --w-text: 500; --w-mid: 600; --w-semi: 700; --w-bold: 800; --w-heavy: 900; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: var(--w-text) 14px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
         padding: 0 0 calc(84px + env(safe-area-inset-bottom)); }
  #app { padding: 0 12px; }
  svg.i { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--hint); }
  .small { font-size: 12.5px; }
  a { color: var(--link); }
  .ok { color: var(--ok); } .bad { color: var(--danger); } .warn { color: var(--warn); }

  /* Шапка */
  .top { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; gap: 8px; height: 52px;
         padding: 0 8px 0 12px; background: var(--card); border-bottom: 1px solid var(--border); }
  .top .logo { display: flex; align-items: center; gap: 7px; cursor: pointer; color: var(--accent); font-weight: var(--w-heavy);
               font-size: 15px; }
  .top .logo svg.i { width: 26px; height: 26px; stroke-width: 2.2; }
  .top .ver { font: var(--w-semi) 11.5px var(--mono); color: var(--ok); background: var(--ok-soft); border-radius: 999px; padding: 2px 8px; }
  .top .sp { flex: 1; }
  .top button { background: none; border: 0; padding: 7px; min-height: 0; color: var(--text); cursor: pointer; border-radius: 10px; }
  .top button:active { background: var(--soft); }
  .top button svg.i { width: 21px; height: 21px; }

  h1 { font-size: 23px; font-weight: var(--w-heavy); letter-spacing: -.01em; margin: 14px 2px 12px; display: flex;
       align-items: center; gap: 8px; flex-wrap: wrap; }
  h2 { font-size: 11.5px; font-weight: var(--w-bold); text-transform: uppercase; letter-spacing: .05em; color: var(--hint);
       margin: 16px 4px 7px; }
  .pill { font: var(--w-semi) 11px var(--mono); border-radius: 999px; padding: 2px 8px; background: var(--soft); color: var(--hint);
          letter-spacing: 0; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px;
          margin-bottom: 10px; box-shadow: var(--shadow); }
  .card.list { padding: 0; overflow: hidden; }
  .card.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }
  .card pre { background: var(--soft); }
  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; }
  .kv + .kv { border-top: 1px solid var(--sep); }
  .kv > :first-child { color: var(--hint); flex: none; }
  .kv > :last-child { text-align: right; overflow-wrap: anywhere; }

  /* Сводка 2×2: крупное число, подпись капсом, пояснение моноширинным */
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border);
           border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
  .sgrid .cell { background: var(--soft); padding: 10px 12px; min-width: 0; }
  .sgrid .cell.tap { cursor: pointer; }
  .sgrid b { display: block; font-size: 19px; line-height: 1.25; font-weight: var(--w-heavy); color: var(--accent);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sgrid b.long { font-size: 15px; line-height: 1.6; }
  .sgrid .lb { font-size: 10.5px; font-weight: var(--w-heavy); text-transform: uppercase; letter-spacing: .04em; margin-top: 1px; }
  .sgrid .sb { font: 11px var(--mono); color: var(--hint); margin-top: 2px; overflow-wrap: anywhere; }

  /* Карточка объекта: рамка по состоянию, точка, имя, чипы, строка действий */
  .ecard { background: var(--card); border: 1.5px solid var(--border); border-radius: 16px; padding: 12px 14px 4px;
           margin-bottom: 10px; box-shadow: var(--shadow); }
  .ecard.on { border-color: color-mix(in srgb, var(--ok) 55%, var(--border)); }
  .ecard.bad { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
  .ecard.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
  .ecard.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .ecard.bad, .ecard.warn { color: var(--text); }
  .ecard .head { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .ecard .name { font-size: 16.5px; font-weight: var(--w-heavy); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
                 white-space: nowrap; }
  .ecard .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 7px 0 3px; cursor: pointer; }
  .ecard .line { font: 12px var(--mono); color: var(--hint); margin: 3px 0; overflow-wrap: anywhere; cursor: pointer; }
  .ecard .note { font-size: 13px; color: var(--hint); margin: 3px 0; }
  .ecard .acts { display: flex; border-top: 1px solid var(--sep); margin: 8px -8px 0; }
  .ecard .acts button { flex: 1; background: none; border: 0; color: var(--hint); font-family: inherit; font-weight: var(--w-mid);
                        font-size: 13.5px; padding: 9px 4px; min-height: 40px; display: flex; align-items: center;
                        justify-content: center; gap: 6px; border-radius: 10px; }
  .ecard .acts button:active { background: var(--soft); }
  .ecard .acts button.bad { color: var(--danger); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--hint); opacity: .55; }
  .dot.on { background: var(--ok); opacity: 1; box-shadow: 0 0 0 3px var(--ok-soft); }
  .dot.bad { background: var(--danger); opacity: 1; box-shadow: 0 0 0 3px var(--danger-soft); }
  .dot.warn { background: var(--warn); opacity: 1; box-shadow: 0 0 0 3px var(--warn-soft); }
  .tag { font: var(--w-semi) 11px var(--mono); border-radius: 7px; padding: 2px 7px; background: var(--soft); color: var(--hint);
         border: 1px solid var(--border); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .tag svg.i { width: 12px; height: 12px; }
  .tag.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }

  /* Строки списка */
  .item { display: flex; align-items: center; gap: 11px; padding: 10px 14px; border-top: 1px solid var(--sep); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item:active { background: var(--soft); }
  .item .main { flex: 1; min-width: 0; }
  .item .title { font-weight: var(--w-bold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .title.wrap, .item .sub.wrap { white-space: normal; }
  .item .sub { color: var(--hint); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .side { color: var(--hint); font: 11.5px var(--mono); text-align: right; flex: none; }
  .item .side svg.i { width: 17px; height: 17px; }
  .item .side.bad { color: var(--danger); }
  .ibox { width: 34px; height: 34px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); flex: none;
          display: flex; align-items: center; justify-content: center; }
  .ibox.bad { background: var(--danger-soft); color: var(--danger); }
  .check { width: 21px; height: 21px; border-radius: 7px; border: 2px solid var(--border); flex: none; display: flex;
           align-items: center; justify-content: center; color: #fff; }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .check svg.i { width: 14px; height: 14px; stroke-width: 3; }
  .radio { width: 21px; height: 21px; border-radius: 50%; border: 2px solid var(--border); flex: none; }
  .radio.on { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px var(--card); }

  /* Плитки разделов */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; cursor: pointer;
          min-height: 84px; box-shadow: var(--shadow); }
  .tile:active { background: var(--soft); }
  .tile .ibox { margin-bottom: 7px; }
  .tile .t { font-weight: var(--w-bold); }
  .tile .s { color: var(--hint); font-size: 11.5px; margin-top: 1px; }
  .tile.soon { opacity: .5; }

  /* Вкладки со счётчиками и переключатель вида */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 2px 0 10px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 8px 8px 7px;
                 min-height: 0; color: var(--hint); font-family: inherit; font-weight: var(--w-semi); font-size: 14px; display: flex;
                 align-items: center; gap: 6px; white-space: nowrap; flex: none; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs .n { font: var(--w-bold) 11px var(--mono); min-width: 21px; height: 21px; border-radius: 11px; padding: 0 6px;
             display: inline-flex; align-items: center; justify-content: center; background: var(--soft); color: var(--hint); }
  .tabs button.on .n { background: var(--accent); color: var(--accent-text); }
  .seg { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; background: none; border: 0; border-radius: 9px; padding: 6px 8px; min-height: 34px; color: var(--hint);
                display: flex; align-items: center; justify-content: center; gap: 6px; font-family: inherit;
                font-weight: var(--w-semi); font-size: 13px; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  .toolbar { display: flex; gap: 7px; align-items: center; margin-bottom: 9px; }
  .toolbar .seg { flex: 1; }
  .toolbar > button { min-height: 42px; }

  /* Кнопки: контурные, главная — залитая; иконка слева */
  button, .btn { font-family: inherit; font-weight: var(--w-semi); font-size: 14px; border: 1px solid var(--border);
                 border-radius: 11px; padding: 9px 12px; cursor: pointer; background: var(--card); color: var(--text);
                 display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; }
  button:disabled { opacity: .5; }
  button:active { filter: brightness(.96); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn-danger { background: var(--card); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); color: var(--danger); }
  .btn-block { width: 100%; margin-top: 7px; }
  .pair { display: grid; grid-template-columns: 1fr 1.25fr; gap: 8px; margin-bottom: 10px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .actions button { justify-content: flex-start; text-align: left; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 7px; z-index: 5;
         padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); }
  .bar button { flex: 1; white-space: nowrap; padding: 9px 6px; }

  /* Поиск, фильтры, формы */
  input, textarea, select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
                            border-radius: 11px; padding: 10px 12px; width: 100%; outline: none; min-height: 42px; }
  textarea { min-height: 96px; resize: vertical; font-family: var(--mono); font-size: 12.5px; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input[type=range] { padding: 0; min-height: 30px; border: 0; background: none; box-shadow: none; accent-color: var(--accent); }
  .search { position: relative; margin-bottom: 9px; }
  .search svg.i { position: absolute; left: 12px; top: 12px; color: var(--hint); }
  .search input { padding-left: 38px; }
  label { display: block; color: var(--hint); font-size: 12.5px; font-weight: var(--w-semi); margin: 12px 4px 5px; }
  .row { display: flex; gap: 7px; align-items: center; }
  .row button { min-width: 48px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 3px 0; scrollbar-width: none; flex-wrap: wrap; }
  .chip { flex: none; min-height: 32px; padding: 5px 12px; border-radius: 9px; background: var(--card); color: var(--hint);
          font-size: 13px; font-weight: var(--w-semi); border: 1px solid var(--border); }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .switch { width: 46px; height: 28px; border-radius: 14px; background: var(--soft); border: 1px solid var(--border); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%;
                   background: var(--hint); opacity: .6; transition: left .15s; }
  .switch.on { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .switch.on::after { left: 21px; background: var(--ok); opacity: 1; }

  /* QR, журналы, всплывающее, выбор снизу */
  .qr { display: block; width: 100%; max-width: 300px; margin: 4px auto; border-radius: 12px; background: #fff; image-rendering: pixelated;
        border: 1px solid var(--border); }
  pre { background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 9px 11px;
        font: 11.5px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 55vh; overflow: auto; margin: 0 0 9px; }
  details.card summary { cursor: pointer; color: var(--hint); font-weight: var(--w-bold); }
  details.card pre { margin: 9px 0 0; }
  .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 10px 15px; border-radius: 11px; font-weight: var(--w-semi); z-index: 20;
           width: max-content; max-width: calc(100vw - 32px); text-align: center; white-space: pre-line;
           box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(8, 15, 25, .45); z-index: 10; display: flex; align-items: flex-end; }
  .sheet { background: var(--bg); width: 100%; border-radius: 18px 18px 0 0; padding: 14px 12px calc(12px + env(safe-area-inset-bottom));
           max-height: 82vh; overflow: auto; }
  .sheet h3 { margin: 2px 6px 10px; font-size: 16px; }
  .sheet button { width: 100%; justify-content: flex-start; text-align: left; margin-bottom: 7px; }
  .sheet .seg button, .sheet .pair button { width: auto; margin: 0; justify-content: center; }
  .empty { text-align: center; color: var(--hint); padding: 26px 10px; }
  .spin { text-align: center; color: var(--hint); padding: 44px 0; }
  .foot { text-align: center; color: var(--hint); font-size: 12px; margin: 16px 0 4px; }
</style>
</head>
<body>
<div id="top"></div>
<div id="app"><div class="spin">Загрузка…</div></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
