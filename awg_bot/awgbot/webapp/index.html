<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AWG Toolza</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* Свои цвета, светлые и тёмные; тема — по Telegram, луна в шапке меняет */
  :root, [data-theme="light"] {
    --bg: #eef2f7;
    --card: #ffffff;
    --soft: #e6edf6;
    --border: #d4dde9;
    --sep: #e3e9f1;
    --text: #0f172a;
    --hint: #64748b;
    --accent: #0a8fd6;
    --accent-soft: #dcefff;
    --accent-text: #ffffff;
    --ok: #0f9e8e;
    --ok-soft: #d6f3ef;
    --danger: #e0443e;
    --danger-soft: #fde4e2;
    --warn: #c2700a;
    --warn-soft: #fdf0dc;
    --link: #0a8fd6;
    --shadow: 0 1px 2px rgba(15, 23, 42, .04);
  }
  [data-theme="dark"] {
    --bg: #0d141e;
    --card: #151f2c;
    --soft: #1b2838;
    --border: #2a3a4f;
    --sep: #223044;
    --text: #e7eef7;
    --hint: #8a9bb2;
    --accent: #36a9ef;
    --accent-soft: #14324a;
    --accent-text: #ffffff;
    --ok: #2cc3ae;
    --ok-soft: #10352f;
    --danger: #f2615b;
    --danger-soft: #3c1c1d;
    --warn: #f0a63c;
    --warn-soft: #3a2a12;
    --link: #4db4f2;
    --shadow: none;
  }
  :root { --mono: ui-monospace, "JetBrains Mono", "SF Mono", "Roboto Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 -apple-system, "Segoe UI", Inter, Roboto, sans-serif; padding: 0 0 calc(92px + env(safe-area-inset-bottom)); }
  #app { padding: 0 14px; }
  svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 2;
          stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--hint); }
  .small { font-size: 13px; }
  a { color: var(--link); }
  .ok { color: var(--ok); } .bad { color: var(--danger); } .warn { color: var(--warn); }

  /* Шапка */
  .top { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; gap: 10px; height: 60px;
         padding: 0 12px 0 14px; background: var(--card); border-bottom: 1px solid var(--border); }
  .top .logo { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--accent); font-weight: 800; }
  .top .logo svg.i { width: 30px; height: 30px; stroke-width: 2.2; }
  .top .ver { font: 600 13px var(--mono); color: var(--ok); background: var(--ok-soft); border-radius: 999px; padding: 3px 10px; }
  .top .sp { flex: 1; }
  .top button { background: none; border: 0; padding: 8px; color: var(--text); cursor: pointer; border-radius: 10px; }
  .top button:active { background: var(--soft); }
  .top button svg.i { width: 23px; height: 23px; }
  @media (max-width: 370px) { .top .logo .name { display: none; } }

  h1 { font-size: 28px; font-weight: 800; letter-spacing: -.01em; margin: 18px 2px 14px; display: flex;
       align-items: center; gap: 10px; flex-wrap: wrap; }
  h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--hint);
       margin: 20px 4px 8px; }
  .pill { font: 600 12px var(--mono); border-radius: 999px; padding: 3px 10px; background: var(--soft); color: var(--hint);
          letter-spacing: 0; white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.bad { background: var(--danger-soft); color: var(--danger); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.accent { background: var(--accent-soft); color: var(--accent); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px;
          margin-bottom: 12px; box-shadow: var(--shadow); }
  .card.list { padding: 0; overflow: hidden; }
  .card.warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }
  .card pre { background: var(--soft); }
  .kv { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; }
  .kv + .kv { border-top: 1px solid var(--sep); }
  .kv > :first-child { color: var(--hint); flex: none; }
  .kv > :last-child { text-align: right; overflow-wrap: anywhere; }

  /* Сводка 2×2: крупное число, подпись капсом, пояснение моноширинным */
  .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border);
           border-radius: 16px; overflow: hidden; margin-bottom: 14px; }
  .sgrid .cell { background: var(--soft); padding: 12px 14px; min-width: 0; }
  .sgrid .cell.tap { cursor: pointer; }
  .sgrid b { display: block; font-size: 23px; line-height: 1.2; font-weight: 800; color: var(--accent);
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sgrid .lb { font-size: 12.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; margin-top: 2px; }
  .sgrid .sb { font: 12.5px var(--mono); color: var(--hint); margin-top: 3px; overflow-wrap: anywhere; }

  /* Карточка объекта: рамка по состоянию, точка, имя, чипы, строка действий */
  .ecard { background: var(--card); border: 1.5px solid var(--border); border-radius: 18px; padding: 14px 16px 6px;
           margin-bottom: 12px; box-shadow: var(--shadow); }
  .ecard.on { border-color: color-mix(in srgb, var(--ok) 55%, var(--border)); }
  .ecard.bad { border-color: color-mix(in srgb, var(--danger) 55%, var(--border)); }
  .ecard.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); }
  .ecard.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .ecard.bad, .ecard.warn { color: var(--text); }
  .ecard .head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .ecard .name { font-size: 19px; font-weight: 800; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ecard .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 4px; cursor: pointer; }
  .ecard .line { font: 13px var(--mono); color: var(--hint); margin: 4px 0; overflow-wrap: anywhere; cursor: pointer; }
  .ecard .note { font-size: 14px; color: var(--hint); margin: 4px 0; }
  .ecard .acts { display: flex; border-top: 1px solid var(--sep); margin: 10px -8px 0; }
  .ecard .acts button { flex: 1; background: none; border: 0; color: var(--hint); font-family: inherit; font-weight: 500; font-size: 15px; padding: 11px 4px;
                        display: flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; }
  .ecard .acts button:active { background: var(--soft); }
  .ecard .acts button.bad { color: var(--danger); }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; background: var(--hint); opacity: .55; }
  .dot.on { background: var(--ok); opacity: 1; box-shadow: 0 0 0 4px var(--ok-soft); }
  .dot.bad { background: var(--danger); opacity: 1; box-shadow: 0 0 0 4px var(--danger-soft); }
  .dot.warn { background: var(--warn); opacity: 1; box-shadow: 0 0 0 4px var(--warn-soft); }
  .tag { font: 600 12.5px var(--mono); border-radius: 8px; padding: 3px 9px; background: var(--soft); color: var(--hint);
         border: 1px solid var(--border); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .tag svg.i { width: 13px; height: 13px; }
  .tag.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .tag.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }

  /* Строки списка */
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--sep); cursor: pointer; }
  .item:first-child { border-top: 0; }
  .item:active { background: var(--soft); }
  .item .main { flex: 1; min-width: 0; }
  .item .title { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--hint); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub.wrap { white-space: normal; }
  .item .side { color: var(--hint); font: 12.5px var(--mono); text-align: right; flex: none; }
  .item .side svg.i { width: 18px; height: 18px; }
  .item .side.bad { color: var(--danger); }
  .ibox { width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); flex: none;
          display: flex; align-items: center; justify-content: center; }
  .ibox.bad { background: var(--danger-soft); color: var(--danger); }
  .check { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--border); flex: none; display: flex;
           align-items: center; justify-content: center; color: #fff; }
  .check.on { background: var(--accent); border-color: var(--accent); }
  .check svg.i { width: 15px; height: 15px; stroke-width: 3; }
  .radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex: none; }
  .radio.on { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px var(--card); }

  /* Плитки разделов */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px; cursor: pointer;
          min-height: 92px; box-shadow: var(--shadow); }
  .tile:active { background: var(--soft); }
  .tile .ibox { margin-bottom: 8px; }
  .tile .t { font-weight: 700; }
  .tile .s { color: var(--hint); font-size: 12.5px; margin-top: 2px; }
  .tile.soon { opacity: .5; }

  /* Вкладки со счётчиками и переключатель вида */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 4px 0 12px; overflow-x: auto; scrollbar-width: none; }
  .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 10px 9px; color: var(--hint);
                 font-family: inherit; font-weight: 600; font-size: 16px; display: flex; align-items: center; gap: 7px; white-space: nowrap; flex: none; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs .n { font: 700 12.5px var(--mono); min-width: 24px; height: 24px; border-radius: 12px; padding: 0 7px; display: inline-flex;
             align-items: center; justify-content: center; background: var(--soft); color: var(--hint); }
  .tabs button.on .n { background: var(--accent); color: var(--accent-text); }
  .seg { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { flex: 1; background: none; border: 0; border-radius: 10px; padding: 8px; color: var(--hint); display: flex;
                align-items: center; justify-content: center; gap: 6px; font-family: inherit; font-weight: 600; font-size: 14px; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .toolbar .seg { flex: 1; }

  /* Кнопки: контурные, главная — залитая; иконка слева */
  button, .btn { font-family: inherit; font-weight: 600; font-size: 15px; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; cursor: pointer;
                 background: var(--card); color: var(--text); display: inline-flex; align-items: center; justify-content: center;
                 gap: 8px; min-height: 48px; }
  button:disabled { opacity: .5; }
  button:active { filter: brightness(.96); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .btn-ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn-danger { background: var(--card); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); color: var(--danger); }
  .btn-block { width: 100%; margin-top: 8px; }
  .pair { display: grid; grid-template-columns: 1fr 1.25fr; gap: 10px; margin-bottom: 12px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .actions button { justify-content: flex-start; text-align: left; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; z-index: 5;
         padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--border); }
  .bar button { flex: 1; white-space: nowrap; padding: 12px 6px; }

  /* Поиск, фильтры, формы */
  input, textarea, select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
                            border-radius: 12px; padding: 12px 13px; width: 100%; outline: none; min-height: 48px; }
  textarea { min-height: 100px; resize: vertical; font-family: var(--mono); font-size: 13px; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search { position: relative; margin-bottom: 10px; }
  .search svg.i { position: absolute; left: 13px; top: 14px; color: var(--hint); }
  .search input { padding-left: 42px; }
  label { display: block; color: var(--hint); font-size: 13px; font-weight: 600; margin: 14px 4px 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row button { min-width: 52px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; scrollbar-width: none; flex-wrap: wrap; }
  .chip { flex: none; min-height: 36px; padding: 6px 14px; border-radius: 10px; background: var(--card); color: var(--hint);
          font-size: 14px; font-weight: 600; border: 1px solid var(--border); }
  .chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .switch { width: 50px; height: 30px; border-radius: 15px; background: var(--soft); border: 1px solid var(--border); position: relative; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
                   background: var(--hint); opacity: .6; transition: left .15s; }
  .switch.on { background: var(--ok-soft); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .switch.on::after { left: 23px; background: var(--ok); opacity: 1; }

  /* QR, журналы, всплывающее, выбор снизу */
  .qr { display: block; width: 100%; max-width: 320px; margin: 4px auto; border-radius: 14px; background: #fff; image-rendering: pixelated;
        border: 1px solid var(--border); }
  pre { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px;
        font: 12px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 55vh; overflow: auto; margin: 0 0 10px; }
  details.card summary { cursor: pointer; color: var(--hint); font-weight: 700; }
  details.card pre { margin: 10px 0 0; }
  .toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%);
           background: var(--text); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; z-index: 20;
           width: max-content; max-width: calc(100vw - 32px); text-align: center; white-space: pre-line;
           box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
  .sheet-bg { position: fixed; inset: 0; background: rgba(8, 15, 25, .45); z-index: 10; display: flex; align-items: flex-end; }
  .sheet { background: var(--bg); width: 100%; border-radius: 20px 20px 0 0; padding: 16px 14px calc(14px + env(safe-area-inset-bottom));
           max-height: 82vh; overflow: auto; }
  .sheet h3 { margin: 2px 6px 12px; font-size: 17px; }
  .sheet button { width: 100%; justify-content: flex-start; text-align: left; margin-bottom: 8px; }
  .empty { text-align: center; color: var(--hint); padding: 30px 10px; }
  .spin { text-align: center; color: var(--hint); padding: 50px 0; }
  .foot { text-align: center; color: var(--hint); font-size: 13px; margin: 18px 0 4px; }
</style>
</head>
<body>
<div id="top"></div>
<div id="app"><div class="spin">Загрузка…</div></div>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
